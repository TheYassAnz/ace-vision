<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ace Vision{% endblock %}</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;color:#1d1d1f;background:#f5f5f7}
nav{background:#fff;border-bottom:1px solid #ddd;padding:12px 24px;display:flex;gap:20px;align-items:center}
nav a{color:#0a58ca;text-decoration:none}nav strong{margin-right:auto}
main{max-width:900px;margin:24px auto;padding:0 24px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #eee}
.btn,button{background:#0a58ca;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:1rem;cursor:pointer;text-decoration:none}
.error{color:#b00020}.notice{background:#fff3cd;padding:10px 14px;border-radius:6px}
progress{width:100%;height:20px}fieldset{border:0;padding:0}label{display:block;margin:6px 0}
</style>
</head>
<body>
<nav><strong>Ace Vision</strong><a href="/">Historique</a><a href="/ajouter">Ajouter un match</a><a href="/reglages">Réglages</a></nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
