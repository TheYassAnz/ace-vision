{% extends "base.html" %}
{% block title %}Réglages — Ace Vision{% endblock %}
{% block content %}
<h1>Réglages</h1>
{% if saved %}<p class="notice">Réglages enregistrés.</p>{% endif %}
<form method="post" action="/reglages">
<fieldset><legend>Main</legend>
<label><input type="radio" name="handedness" value="right" {{ "checked" if s.handedness == "right" }}> Droitier</label>
<label><input type="radio" name="handedness" value="left" {{ "checked" if s.handedness == "left" }}> Gaucher</label>
</fieldset>
<fieldset><legend>Revers</legend>
<label><input type="radio" name="backhand_hands" value="1" {{ "checked" if s.backhand_hands == 1 }}> À une main</label>
<label><input type="radio" name="backhand_hands" value="2" {{ "checked" if s.backhand_hands == 2 }}> À deux mains</label>
<p>Sans effet sur la détection pour l'instant (réservé à l'analyse technique).</p>
</fieldset>
<p><button type="submit">Enregistrer</button></p>
</form>
{% endblock %}
